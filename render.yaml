# Render Blueprint for BunonBrain — FREE plan. Step-by-step guide: DEPLOY_RENDER.md
#
#   bunonbrain-web  Next.js frontend         free  https://bunonbrain-web.onrender.com
#   bunonbrain-api  .NET 10 API (Docker)     free  https://bunonbrain-api.onrender.com
#   bunonbrain-rag  Python PDF RAG (Docker)  free  https://bunonbrain-rag.onrender.com (every route but /health needs PYRAG_API_KEY)
#
# Not on Render: the database (Supabase), the vector store (Qdrant Cloud) and the
# computer-vision service (a PC inside the factory, next to the cameras).
#
# Free plan limits (see DEPLOY_RENDER.md, section 1):
#   - each service sleeps after 15 idle minutes and takes ~1 minute to wake;
#   - no disk: uploaded files (QC images, documents, photos) are lost whenever
#     the API sleeps, restarts or redeploys; everything in the database stays;
#   - free services can't receive private-network traffic, so they call each
#     other over their public https URLs;
#   - 750 free instance hours per month for the whole workspace.
#
# If Render adds a suffix to a service name (bunonbrain-api-ab12.onrender.com),
# fix the URLs below in the dashboard. Every "sync: false" value is asked for
# when the Blueprint is created. Secrets are never written in this file.
#
# Singapore is the closest Render region to Supabase ap-south-1 (Mumbai).

services:
  # ───────────────────────────── .NET API ─────────────────────────────
  - type: web
    name: bunonbrain-api
    runtime: docker
    region: singapore
    plan: free
    dockerContext: .
    dockerfilePath: ./BunonBrain.Backend/BunonBrain.Api/Dockerfile
    healthCheckPath: /health
    buildFilter:
      paths:
        - BunonBrain.Backend/**
    envVars:
      - key: PORT
        value: "8080"
      - key: ASPNETCORE_ENVIRONMENT
        value: Production

      # Database: Supabase "Session pooler" string (port 5432, never 6543),
      # ending with ;Maximum Pool Size=10 (the pooler allows only 15 clients).
      - key: BUNONBRAIN_DB
        sync: false

      # Auth
      - key: JWT_SIGNING_KEY
        generateValue: true
      - key: Jwt__Issuer
        value: bunonbrain
      - key: Jwt__Audience
        value: bunonbrain
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
      # Must be the SAME value as your local .env when Render uses the same
      # database: AI keys / camera passwords saved in the DB were encrypted with it.
      - key: AI_SETTINGS_ENCRYPTION_KEY
        sync: false

      # The frontend calls the API over its public URL, so the API sees the
      # frontend server's IP for every user: the per-IP login limit is shared.
      # 30/minute keeps brute force slow without locking out a classroom of users.
      - key: FORWARDED_HEADERS_ENABLED
        value: "true"
      - key: LOGIN_RATE_LIMIT_PER_MINUTE
        value: "30"
      - key: CORS_ORIGINS          # e.g. https://bunonbrain-web.onrender.com
        sync: false
      - key: PUBLIC_APP_URL        # same frontend URL, used in password-reset emails
        sync: false

      # LLM (Ask BunonBrain, QC vision): Gemini has a free tier. For OpenAI set
      # LLM_PROVIDER=openai and an OpenAI model/key. A provider saved later under
      # Settings → AI (stored in the database) overrides these.
      - key: LLM_PROVIDER
        value: gemini
      - key: LLM_MODEL
        value: gemini-2.5-flash
      - key: LLM_API_KEY           # Gemini key (the same one as GOOGLE_API_KEY below)
        sync: false
      - key: QC_VISION_PROVIDER
        value: llm

      # Backend pgvector RAG: keep 384 (local embedder) to match vectors already in the DB.
      - key: Rag__EmbeddingDimensions
        value: "384"

      # Python RAG service (public URL, protected by the generated key).
      - key: PYRAG_SERVICE_URL
        value: https://bunonbrain-rag.onrender.com
      - key: PYRAG_API_KEY
        fromService:
          type: web
          name: bunonbrain-rag
          envVarKey: PYRAG_API_KEY
      - key: PYRAG_COLLECTION_NAME
        value: pdf_rag
      - key: PYRAG_TIMEOUT_SECONDS   # leaves room for the RAG service to wake up
        value: "120"

      # Computer-vision service (runs in the factory). Copy this generated value
      # into computer-vision/.env as CV_BACKEND_SERVICE_KEY.
      - key: CV_SERVICE_KEY
        generateValue: true
      - key: CV_SERVICE_FACTORIES
        value: MAIN

      # Plant settings
      - key: PRODUCTION_TIME_ZONE
        value: Asia/Dhaka
      - key: SIMULATOR_ENABLED
        value: "false"
      - key: DOCUMENT_AUTOMATION_ENABLED
        value: "false"

  # ───────────────────────────── Next.js frontend ─────────────────────────────
  - type: web
    name: bunonbrain-web
    runtime: node
    region: singapore
    plan: free
    rootDir: frontend
    # Lint is run separately; a lint crash must not block a deploy.
    buildCommand: npm ci && npx next build --no-lint
    startCommand: npx next start      # next start listens on $PORT
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: NEXT_PUBLIC_SHOW_ARCHITECTURE
        value: "false"
      # /api/* and /hubs/* are proxied server-side to the API. Read at BUILD
      # time (rewrites are baked in): after changing them use
      # Manual Deploy → Clear build cache & deploy.
      - key: NEXT_PUBLIC_API_URL
        value: https://bunonbrain-api.onrender.com
      - key: DOTNET_API_URL
        value: https://bunonbrain-api.onrender.com

  # ───────────────────────────── Python PDF RAG ─────────────────────────────
  - type: web
    name: bunonbrain-rag
    runtime: docker
    region: singapore
    plan: free               # public, so PYRAG_API_KEY (generated below) must stay set
    dockerContext: ./rag
    dockerfilePath: ./rag/Dockerfile
    healthCheckPath: /health
    buildFilter:
      paths:
        - rag/**
    envVars:
      - key: PORT
        value: "8000"
      - key: PYRAG_API_KEY
        generateValue: true
      # Gemini embeddings: no torch in the image, fits in 512 MB.
      - key: PYRAG_EMBEDDING_PROVIDER
        value: google
      - key: GOOGLE_API_KEY
        sync: false
      - key: PYRAG_LLM_MODEL
        value: gemini-2.5-flash
      - key: PYRAG_TEMPERATURE
        value: "0.2"
      - key: PYRAG_TOP_K
        value: "4"
      # Qdrant Cloud cluster URL (https://...:6333) and API key.
      - key: PYRAG_QDRANT_URL
        sync: false
      - key: PYRAG_QDRANT_API_KEY
        sync: false
      - key: PYRAG_COLLECTION_NAME
        value: pdf_rag
      - key: PYRAG_MAX_UPLOAD_MB
        value: "50"

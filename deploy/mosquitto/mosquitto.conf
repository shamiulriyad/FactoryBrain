# Local Mosquitto broker for BunonBrain IoT integration testing with real
# devices (ESP32, gateways) on the factory network. Not needed for the
# simulator or the automated tests (they use an in-process broker).
#
#   docker compose -f deploy/mosquitto/docker-compose.yml up -d
#
# Accounts: create the password file once (passwords are hashed by Mosquitto;
# never commit the generated file):
#   docker compose -f deploy/mosquitto/docker-compose.yml run --rm mosquitto \
#     mosquitto_passwd -c /mosquitto/config/passwd bunonbrain-backend
#   docker compose -f deploy/mosquitto/docker-compose.yml run --rm mosquitto \
#     mosquitto_passwd /mosquitto/config/passwd S-L1-T025      # one account per device, named by its device code
# Then restart the broker.

persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice

# No anonymous clients: every device and the backend authenticate.
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

# Plain MQTT for the local network / development only.
listener 1883

# TLS for anything that leaves the factory network (uncomment and add certificates).
# listener 8883
# cafile /mosquitto/certs/ca.crt
# certfile /mosquitto/certs/broker.crt
# keyfile /mosquitto/certs/broker.key
# tls_version tlsv1.2
